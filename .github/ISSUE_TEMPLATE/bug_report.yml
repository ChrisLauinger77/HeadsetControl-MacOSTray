name: Bug report
description: Report a reproducible problem with HeadsetControl-MacOSTray
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues before submitting a new one and include as much detail as possible.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I am using a headset supported by HeadsetControl, or this issue is unrelated to headset compatibility.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and what did you expect to happen instead?
      placeholder: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find this in the app's About window or provide the Git commit if building from source.
      placeholder: e.g. 3.0.0 or commit abc1234
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.6.1
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model and processor
      placeholder: e.g. MacBook Pro (M3 Pro)

  - type: input
    id: headset
    attributes:
      label: Headset model
      description: Include the connection type (USB, wireless dongle, Bluetooth, etc.) when relevant.
      placeholder: e.g. SteelSeries Arctis 7 via USB dongle
    validations:
      required: true

  - type: input
    id: headsetcontrol-version
    attributes:
      label: HeadsetControl version
      description: Run `headsetcontrol --version` in Terminal. Enter "not installed separately" if that applies.
      placeholder: Paste the version output here.
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Homebrew cask
        - GitHub release
        - Built from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: test-mode
    attributes:
      label: Test mode enabled?
      options:
        - "No"
        - "Yes"
        - Unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots, or a screen recording. Remove personal or sensitive information first.
      placeholder: Drag files here or paste logs inside a code block.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include anything else that may help, such as whether the problem started after an update or also occurs with the HeadsetControl CLI.
