name: Release

# Stage 1 (manual run on main): build, test and retain a release candidate.
# Stage 2 (annotated vX.Y.Z tag with a Candidate-Run line): publish that
# candidate's exact bytes. Publication never rebuilds the application.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Candidates never wait for or cancel each other. Publication and its retries
# share one per-tag lock without canceling an active publisher.
concurrency:
  group: ${{ github.event_name == 'push' && format('release-{0}', github.ref) || format('release-candidate-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      build_number: ${{ steps.build-number.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release publication and packaging scripts
        run: |
          node --test scripts/tests/*.test.cjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Read consistent application version
        id: version
        run: |
          version="$(python3 -B scripts/release-artifact.py project HeadsetControl-MacOSTray.xcodeproj/project.pbxproj \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["CFBundleShortVersionString"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check candidate source and unreleased version
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const { checkCandidateSource } = require('./scripts/release.cjs');
            core.setOutput('tag', await checkCandidateSource(github, context.repo, {
              event: context.eventName, ref: context.ref, defaultBranch: process.env.DEFAULT_BRANCH,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT, version: process.env.VERSION }));

      - name: Generate release build number
        id: build-number
        env:
          TZ: Europe/Berlin
        run: echo "value=$(date +'%y%m%d.%H%M')" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and test pinned native contract
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/build-native-app.py \
            --workspace "${{ runner.temp }}/native-contract" \
            --arch "${{ matrix.arch }}" \
            --build-number "${{ needs.validate.outputs.build_number }}"

      - name: Upload architecture archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-contract/HeadsetControl-MacOSTray-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1
          # These are private build intermediates, never GitHub release assets.
          overwrite: true

  package:
    needs: [validate, build]
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download architecture archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: app-*
          path: ${{ runner.temp }}/architecture-archives
          merge-multiple: true

      - name: Create and verify universal app archive
        run: |
          mkdir "${{ runner.temp }}/release-assets"
          bash scripts/create-universal-app.sh \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-arm64.zip" \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-x86_64.zip" \
            "${{ runner.temp }}/release-assets/HeadsetControl-MacOSTray.zip" \
            "${{ needs.validate.outputs.tag }}"

      - name: Record candidate checksum and provenance
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/release-assets
          VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const { writeCandidate, validateArchive, ASSET_NAME } = require('./scripts/release.cjs');
            const directory = process.env.CANDIDATE_DIR;
            const { digest } = writeCandidate(directory, { version: process.env.VERSION, commit: context.sha,
              runID: context.runId, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              repository: `${context.repo.owner}/${context.repo.repo}` });
            // Apply the publisher's own archive gate before retaining the candidate.
            validateArchive(require('node:fs').readFileSync(require('node:path').join(directory, ASSET_NAME)),
              `v${process.env.VERSION}`);
            core.setOutput('digest', digest);

      # Publication downloads these exact files; they are never rebuilt or regenerated.
      - name: Retain release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 30

      - name: Print publishing commands
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        with:
          script: |
            const { candidateSummary } = require('./scripts/release.cjs');
            const text = candidateSummary({ version: process.env.VERSION, commit: context.sha,
              runID: context.runId, digest: process.env.DIGEST });
            core.info(text);
            await core.summary.addRaw(text).write();

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Archive validation inspects Mach-O slices and signatures with macOS tools.
    runs-on: macos-15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check tag matches application version
        run: python3 -B scripts/release-artifact.py project HeadsetControl-MacOSTray.xcodeproj/project.pbxproj --tag "$GITHUB_REF_NAME"

      - name: Verify annotated tag and candidate run
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const { resolveCandidate } = require('./scripts/release.cjs');
            const result = await resolveCandidate(github, context.repo, { tag: process.env.RELEASE_TAG,
              commit: context.sha, currentRunID: context.runId, defaultBranch: process.env.DEFAULT_BRANCH });
            core.info(`Publishing candidate run ${result.runID}, artifact ${result.artifactID}`);
            core.setOutput('run_id', result.runID);
            core.setOutput('artifact_id', result.artifactID);

      - name: Download verified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify candidate files and publish exact bytes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CANDIDATE_DIR: ${{ runner.temp }}/release-assets
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        with:
          script: |
            const { verifyCandidateFiles, prepareRelease, publishRelease } = require('./scripts/release.cjs');
            const tag = process.env.RELEASE_TAG;
            // All candidate checks happen before any release mutation.
            const { archivePath, digest } = verifyCandidateFiles(process.env.CANDIDATE_DIR, { tag, commit: context.sha,
              runID: Number(process.env.CANDIDATE_RUN_ID), repository: `${context.repo.owner}/${context.repo.repo}` });
            const { releaseID } = await prepareRelease(github, context.repo, tag);
            const result = await publishRelease(github, context.repo, { tag, releaseID, archivePath, expectedDigest: digest });
            core.info(`Verified release ${result.releaseID}: ${result.digest}`);

  request-cask-update:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Request Homebrew cask update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.PACKAGE_REPOSITORIES_TOKEN }}
          script: |
            const { requestCaskUpdate } = require('./scripts/release.cjs');
            await requestCaskUpdate(github);
