name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Cover preparation, publication, and retries with the same per-tag lock.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.build-number.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check that tag points to main
        run: |
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Check tag matches application version
        run: python3 scripts/release-artifact.py project HeadsetControl-MacOSTray.xcodeproj/project.pbxproj --tag "$GITHUB_REF_NAME"

      - name: Generate release build number
        id: build-number
        env:
          TZ: Europe/Berlin
        run: echo "value=$(date +'%y%m%d.%H%M')" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      published: ${{ steps.prepare.outputs.published }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find or create release
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const { prepareRelease } = require('./scripts/release.cjs');
            const result = await prepareRelease(github, context.repo, process.env.RELEASE_TAG);
            core.setOutput('release_id', result.releaseID);
            core.setOutput('published', result.published);

  build:
    needs: [validate-tag, prepare-release]
    if: needs.prepare-release.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and test pinned native contract
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/build-native-app.py \
            --workspace "${{ runner.temp }}/native-contract" \
            --arch "${{ matrix.arch }}" \
            --build-number "${{ needs.validate-tag.outputs.build_number }}"

      - name: Upload architecture archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-contract/HeadsetControl-MacOSTray-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1
          # These are private build intermediates, never GitHub release assets.
          overwrite: true

  package:
    needs: build
    runs-on: macos-15
    outputs:
      archive_sha256: ${{ steps.checksum.outputs.archive_sha256 }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download architecture archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: app-*
          path: ${{ runner.temp }}/architecture-archives
          merge-multiple: true

      - name: Create universal app archive
        run: |
          bash scripts/create-universal-app.sh \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-arm64.zip" \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-x86_64.zip" \
            "${{ runner.temp }}/HeadsetControl-MacOSTray.zip" \
            "$GITHUB_REF_NAME"

      - name: Record publication candidate checksum
        id: checksum
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
        with:
          script: |
            const { sha256 } = require('./scripts/release.cjs');
            core.setOutput('archive_sha256', sha256(require('node:fs').readFileSync(process.env.ARCHIVE_PATH)));

      # Publication retries must use these exact ZIP bytes, not repackage them.
      - name: Retain publication candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare-release, package]
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' && (needs.package.result == 'success' || (needs.prepare-release.outputs.published == 'true' && needs.package.result == 'skipped')) }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download exact publication candidate
        if: needs.prepare-release.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Verify archive and resume publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          ALREADY_PUBLISHED: ${{ needs.prepare-release.outputs.published }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_PATH: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
          EXPECTED_DIGEST: ${{ needs.package.outputs.archive_sha256 }}
        with:
          script: |
            const { publishRelease } = require('./scripts/release.cjs');
            const result = await publishRelease(github, context.repo, {
              tag: process.env.RELEASE_TAG,
              releaseID: Number(process.env.RELEASE_ID),
              archivePath: process.env.ALREADY_PUBLISHED === 'true' ? undefined : process.env.ARCHIVE_PATH,
              expectedDigest: process.env.EXPECTED_DIGEST
            });
            core.info(`Verified release ${result.releaseID}: ${result.digest}`);

  request-cask-update:
    needs: publish
    # Publication can succeed with its build dependency skipped on a rerun.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Request Homebrew cask update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.HOMEBREW_CASK_PUSH_TOKEN }}
          script: |
            const { requestCaskUpdate } = require('./scripts/release.cjs');
            await requestCaskUpdate(github);
