name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that tag points to main
        run: |
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Install Homebrew dependencies
        run: |
          brew tap sapd/headsetcontrol
          brew install sapd/headsetcontrol/headsetcontrol --HEAD

      - name: Test
        run: |
          homebrew_prefix="$(brew --prefix)"
          swift test \
            -Xcc "-I${homebrew_prefix}/include" \
            -Xlinker "-L${homebrew_prefix}/lib" \
            -Xlinker -lheadsetcontrol \
            -Xlinker -lhidapi \
            -Xlinker -lc++

      - name: Build ad-hoc signed app
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          xcodebuild \
            -scheme HeadsetControl-MacOSTray \
            -project HeadsetControl-MacOSTray.xcodeproj \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            build

      - name: Verify app signature
        env:
          APP_PATH: ${{ runner.temp }}/DerivedData/Build/Products/Release/HeadsetControl-MacOSTray.app
        run: codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Create release archive
        env:
          APP_PATH: ${{ runner.temp }}/DerivedData/Build/Products/Release/HeadsetControl-MacOSTray.app
          ARCHIVE_PATH: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
        run: ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
          generate_release_notes: true
          draft: false
          body: |
            The macOS build is ad-hoc signed but cannot be notarized without a paid Apple Developer Program membership. On first launch, Control-click HeadsetControl-MacOSTray and choose Open. See the README for additional Gatekeeper instructions.

      - name: Request Homebrew cask update
        env:
          HOMEBREW_CASK_PUSH_TOKEN: ${{ secrets.HOMEBREW_CASK_PUSH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HOMEBREW_CASK_PUSH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ChrisLauinger77/homebrew-cask/dispatches \
            --data '{"event_type":"update-cask","client_payload":{"cask":"headsetcontrol-macostray"}}'
