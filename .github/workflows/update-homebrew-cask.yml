name: Request Homebrew cask update

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  request-update:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch cask update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_CASK_PUSH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ChrisLauinger77/homebrew-cask/dispatches \
            --data '{"event_type":"update-cask","client_payload":{"cask":"headsetcontrol-macostray"}}'
