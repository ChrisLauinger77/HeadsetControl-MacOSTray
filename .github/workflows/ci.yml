name: CI

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            arch: arm64
          - runner: xcode-27
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select compatible Xcode
        run: |
          developer_dir="$(python3 -B scripts/select-xcode.py)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
      - name: Validate dependency channels against the current base
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: python3 -B scripts/dependency_channels.py --base-branch "$BASE_BRANCH"
      - name: Validate Renovate configuration and workflow syntax
        if: matrix.arch == 'arm64'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const path = require('node:path');
            const tools = path.join(process.env.RUNNER_TEMP, 'dependency-validation');
            // Use this pinned action's Node runtime for the validator, not the runner default.
            const env = { ...process.env, PATH: path.dirname(process.execPath) + path.delimiter + process.env.PATH };
            execFileSync('npm', ['install', '--prefix', tools, '--ignore-scripts', '--no-audit', '--no-fund', 'renovate@44.65.5'], { env, stdio: 'inherit' });
            // Build only the required native regex engine; do not accept RegExp fallback.
            execFileSync('npm', ['rebuild', '--prefix', tools, 're2'], { env, stdio: 'inherit' });
            execFileSync(process.execPath, [path.join(tools, 'node_modules/renovate/dist/config-validator.js'), '--strict', '--no-global', 'renovate.json'], { env, stdio: 'inherit' });
            execFileSync(process.execPath, ['--test', 'scripts/tests/renovate-config.test.cjs'], { env: { ...env, DEPENDENCY_TOOLS: tools }, stdio: 'inherit' });
      - name: Test release publication and packaging
        run: |
          node --test scripts/tests/*.test.cjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Ensure Rosetta is available for Intel tests
        if: matrix.arch == 'x86_64'
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Build and test native contract
        run: |
          python3 -B scripts/build-native-app.py \
            --workspace "${{ runner.temp }}/native-contract" \
            --arch "${{ matrix.arch }}"
