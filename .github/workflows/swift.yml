name: Swift

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
      - name: Test release publication and packaging
        run: |
          node --test scripts/tests/*.test.cjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Build and test pinned native contract
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/build-native-app.py \
            --workspace "${{ runner.temp }}/native-contract" \
            --arch "${{ matrix.arch }}"

      - name: Upload architecture archive
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-contract/HeadsetControl-MacOSTray-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  verify-universal:
    needs: build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
      - name: Download architecture archives
        uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: ${{ runner.temp }}/architecture-archives
          merge-multiple: true
      - name: Create and verify universal app archive
        run: |
          bash scripts/create-universal-app.sh \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-arm64.zip" \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-x86_64.zip" \
            "${{ runner.temp }}/HeadsetControl-MacOSTray.zip"
      - name: Upload universal archive
        uses: actions/upload-artifact@v7
        with:
          name: HeadsetControl-MacOSTray-universal
          path: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
          if-no-files-found: error
          retention-days: 7
