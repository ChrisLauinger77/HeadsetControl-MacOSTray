name: Swift

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate dependency channels against the current base
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: python3 -B scripts/dependency_channels.py --base-branch "$BASE_BRANCH"
      - name: Validate Renovate configuration and workflow syntax
        if: matrix.arch == 'arm64'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const path = require('node:path');
            const tools = path.join(process.env.RUNNER_TEMP, 'dependency-validation');
            // Use this pinned action's Node runtime for the validator, not the runner default.
            const env = { ...process.env, PATH: path.dirname(process.execPath) + path.delimiter + process.env.PATH };
            execFileSync('npm', ['install', '--prefix', tools, '--ignore-scripts', '--no-audit', '--no-fund', 'renovate@44.65.5'], { env, stdio: 'inherit' });
            // Build only the required native regex engine; do not accept RegExp fallback.
            execFileSync('npm', ['rebuild', '--prefix', tools, 're2'], { env, stdio: 'inherit' });
            execFileSync(process.execPath, [path.join(tools, 'node_modules/renovate/dist/config-validator.js'), '--strict', '--no-global', 'renovate.json'], { env, stdio: 'inherit' });
            execFileSync(process.execPath, ['--test', 'scripts/tests/renovate-config.test.cjs'], { env: { ...env, DEPENDENCY_TOOLS: tools }, stdio: 'inherit' });
      - name: Test release publication and packaging
        run: |
          node --test scripts/tests/*.test.cjs
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Build and test pinned native contract
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/build-native-app.py \
            --workspace "${{ runner.temp }}/native-contract" \
            --arch "${{ matrix.arch }}"

      - name: Upload architecture archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-contract/HeadsetControl-MacOSTray-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  verify-universal:
    needs: build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download architecture archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: app-*
          path: ${{ runner.temp }}/architecture-archives
          merge-multiple: true
      - name: Create and verify universal app archive
        run: |
          bash scripts/create-universal-app.sh \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-arm64.zip" \
            "${{ runner.temp }}/architecture-archives/HeadsetControl-MacOSTray-x86_64.zip" \
            "${{ runner.temp }}/HeadsetControl-MacOSTray.zip"
      - name: Upload universal archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: HeadsetControl-MacOSTray-universal
          path: ${{ runner.temp }}/HeadsetControl-MacOSTray.zip
          if-no-files-found: error
          retention-days: 7
