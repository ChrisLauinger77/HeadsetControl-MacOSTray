# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"
      - ".github/FUNDING.yml"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "LICENSE"
      - ".github/FUNDING.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
      - name: Install Homebrew dependencies
        run: |
          brew tap sapd/headsetcontrol
          brew install sapd/headsetcontrol/headsetcontrol --HEAD
      - name: Test
        run: |
          HOMEBREW_PREFIX="$(brew --prefix)"
          swift test \
            -Xcc "-I${HOMEBREW_PREFIX}/include" \
            -Xlinker "-L${HOMEBREW_PREFIX}/lib" \
            -Xlinker -lheadsetcontrol \
            -Xlinker -lhidapi \
            -Xlinker -lc++
      - name: Build
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          xcodebuild -scheme HeadsetControl-MacOSTray \
            -project HeadsetControl-MacOSTray.xcodeproj \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            build
      - name: Verify app signature
        env:
          APP_PATH: ${{ runner.temp }}/DerivedData/Build/Products/Release/HeadsetControl-MacOSTray.app
        run: codesign --verify --deep --strict --verbose=4 "$APP_PATH"
